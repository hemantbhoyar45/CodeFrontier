services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      KNOWBRIDGE_DB_USER: ${KNOWBRIDGE_DB_USER:?Set KNOWBRIDGE_DB_USER in .env}
      KNOWBRIDGE_DB_PASSWORD: ${KNOWBRIDGE_DB_PASSWORD:?Set KNOWBRIDGE_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/00-create-runtime-role.sh:/docker-entrypoint-initdb.d/00-create-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      KNOWBRIDGE_ENVIRONMENT: ${KNOWBRIDGE_ENVIRONMENT:-production}
      KNOWBRIDGE_LOG_LEVEL: ${KNOWBRIDGE_LOG_LEVEL:-INFO}
      KNOWBRIDGE_JWT_SECRET_KEY: ${KNOWBRIDGE_JWT_SECRET_KEY:?Set KNOWBRIDGE_JWT_SECRET_KEY in .env}
      KNOWBRIDGE_ACCESS_TOKEN_EXPIRE_MINUTES: ${KNOWBRIDGE_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      KNOWBRIDGE_RATE_LIMIT_PER_MINUTE: ${KNOWBRIDGE_RATE_LIMIT_PER_MINUTE:-120}
      KNOWBRIDGE_AUTH_RATE_LIMIT_PER_MINUTE: ${KNOWBRIDGE_AUTH_RATE_LIMIT_PER_MINUTE:-10}
      KNOWBRIDGE_CORS_ORIGINS: ${KNOWBRIDGE_CORS_ORIGINS:-["http://localhost:3000"]}
      KNOWBRIDGE_DATABASE_URL: postgresql+psycopg://${KNOWBRIDGE_DB_USER}:${KNOWBRIDGE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KNOWBRIDGE_REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "python -m alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["python", "-m", "celery", "-A", "workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      KNOWBRIDGE_ENVIRONMENT: ${KNOWBRIDGE_ENVIRONMENT:-production}
      KNOWBRIDGE_LOG_LEVEL: ${KNOWBRIDGE_LOG_LEVEL:-INFO}
      KNOWBRIDGE_JWT_SECRET_KEY: ${KNOWBRIDGE_JWT_SECRET_KEY:?Set KNOWBRIDGE_JWT_SECRET_KEY in .env}
      KNOWBRIDGE_DATABASE_URL: postgresql+psycopg://${KNOWBRIDGE_DB_USER}:${KNOWBRIDGE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KNOWBRIDGE_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from workers.celery_app import celery_app; replies=celery_app.control.ping(timeout=4); raise SystemExit(0 if replies else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
