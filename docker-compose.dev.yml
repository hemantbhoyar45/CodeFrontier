services:
  backend:
    build:
      target: development
    environment:
      KNOWBRIDGE_ENVIRONMENT: development
    volumes:
      - .:/app

  worker:
    build:
      target: development
    environment:
      KNOWBRIDGE_ENVIRONMENT: development
    volumes:
      - .:/app

  frontend:
    build:
      target: development
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

volumes:
  frontend_node_modules:
